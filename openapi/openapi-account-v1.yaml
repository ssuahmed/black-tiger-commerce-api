          type: string
        website:
          type: string
          format: uri
        isSubsidiary:
          type: boolean
          default: false

    AccountPreferencesInput:
      type: object
      required: [accountsPayablePhone, accountsPayableEmail, currency, creditLimitDesired]
      properties:
        accountsPayablePhone:
          type: string
        accountsPayableEmail:
          type: string
          format: email
        currency:
          type: string
          example: SAR
        creditLimitDesired:
          type: number
          format: double
        preferredLanguage:
          type: string

